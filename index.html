const CW=195,CH=212,SH=84,SW=SH*CW/CH;
const H=360,G=290;let W=720;

try{hi=+localStorage.getItem('juvyHi')||0}catch(e){}

// ปรับขนาดจอให้พอดีมือถือ/คอม และคมชัดตามความละเอียดหน้าจอ
function fit(){
  const hudH=document.getElementById('hud').offsetHeight+document.getElementById('hint').offsetHeight+30;
  const aw=Math.min(innerWidth-16,900),ah=Math.max(innerHeight-hudH-20,160);
  W=Math.round(Math.max(420,Math.min(800,H*aw/ah)));
  const sc=Math.min(aw/W,ah/H),d=Math.min(devicePixelRatio||1,3);
  cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';
  cv.width=Math.round(W*sc*d);cv.height=Math.round(H*sc*d);
  x.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));

function reset(){st={y:G,vy:0,air:false,obs:[],items:[],t:0,sp:5,ph:0,sx:0,gx:0,coins:0,bots:0,score:0,over:false,overAt:0,started:false,next:60}}
reset();
function jump(){
  if(st.over){if(performance.now()-st.overAt>450)reset();return}
  st.started=true;
  if(!st.air){st.vy=-14;st.air=true}
}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});
addEventListener('pointerdown',e=>{e.preventDefault();jump()},{passive:false});
addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

function spawn(){
  if(Math.random()<.5)st.obs.push({x:W+20,w:30,h:36+Math.random()*30});
  const iy=G-60-Math.random()*70;
  st.items.push({x:W+20+Math.random()*120,y:iy,k:Math.random()<.6?'coin':'bottle'});
  st.next=55+Math.random()*50;
}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(){
  if(!st.started||st.over)return;
  st.t++;st.sp=5+st.t/900;
  st.ph+=st.sp*.05;st.sx+=st.sp*.25;st.gx+=st.sp;
  st.vy+=.8;st.y+=st.vy;
  if(st.y>=G){st.y=G;st.vy=0;st.air=false}
  if(--st.next<=0)spawn();
  const me={x:86,y:st.y-62,w:30,h:64};
  st.obs.forEach(o=>{o.x-=st.sp;if(hit({x:me.x+4,y:me.y+4,w:me.w-8,h:me.h-4},{x:o.x,y:G-o.h+6,w:o.w,h:o.h})){
    st.over=true;st.overAt=performance.now();
    if(st.score>hi){hi=st.score;try{localStorage.setItem('juvyHi',hi)}catch(e){}}}});
  st.items.forEach(i=>{i.x-=st.sp;if(!i.got&&hit(me,i.k==='coin'?{x:i.x-12,y:i.y-14,w:24,h:28}:{x:i.x-12,y:i.y-24,w:24,h:48})){
    i.got=true;if(i.k==='coin'){st.coins++;st.score+=10}else{st.bots++;st.score+=50}}});
  st.obs=st.obs.filter(o=>o.x>-50);st.items=st.items.filter(i=>i.x>-30&&!i.got);
  c.textContent=st.coins;b.textContent=st.bots;s.textContent=st.score;
}

// เฟรมจากชีตมาสคอต: 0-5 = วิ่ง, 6 = กระโดดขึ้น, 7 = กระโดดลง
function juvy(px){
  const air=st.air,k=air?(st.vy<0?6:7):(Math.floor(st.ph)%6),h=G-st.y;
  x.fillStyle='rgba(20,50,20,.25)';x.beginPath();x.ellipse(px+SW/2,G+8,22*(1-h/260),5*(1-h/260),0,0,7);x.fill();
  x.drawImage(IJ,k*CW,0,CW,CH,px,st.y+6-SH+2,SW,SH);
}
// วาดภาพวนซ้ำแบบสลับกลับด้าน ขอบต่อกันเนียน
function tile(img,sy,sh,dy,dh,off){
  const tw=img.width*dh/sh,o=((off%(tw*2))+tw*2)%(tw*2);
  for(let i=-1;i*tw-o<W+tw;i++){
    const dx=i*tw-o;x.save();
    if(((i%2)+2)%2){x.translate(dx+tw,0);x.scale(-1,1);x.drawImage(img,0,sy,img.width,sh,0,dy,tw,dh)}
    else x.drawImage(img,0,sy,img.width,sh,dx,dy,tw,dh);
    x.restore();
  }
}
function draw(){
  x.clearRect(0,0,W,H);
  x.fillStyle='#5b9be0';x.fillRect(0,0,W,H);
  if(SKY.complete)tile(SKY,0,SKY.height,-40,H,st.sx);
  if(GR.complete)tile(GR,0,GR.height,G+6,H-G-6,st.gx);
  st.obs.forEach(o=>{o.x-=st.sp;if(hit({x:me.x+4,y:me.y+4,w:me.w-8,h:me.h-4},{x:o.x,y:G-o.h+6,w:o.w,h:o.h})){
    st.over=true;st.overAt=performance.now();
    if(st.score>hi){hi=st.score;try{localStorage.setItem('juvyHi',hi)}catch(e){}}}});
  st.items.forEach(i=>{i.x-=st.sp;if(!i.got&&hit(me,i.k==='coin'?{x:i.x-12,y:i.y-14,w:24,h:28}:{x:i.x-12,y:i.y-24,w:24,h:48})){
    i.got=true;if(i.k==='coin'){st.coins++;st.score+=10}else{st.bots++;st.score+=50}}});
  st.obs=st.obs.filter(o=>o.x>-50);st.items=st.items.filter(i=>i.x>-30&&!i.got);
  c.textContent=st.coins;b.textContent=st.bots;s.textContent=st.score;
}

let last=0,acc=0;
function loop(ts){
  if(!last)last=ts;acc+=Math.min(ts-last,100);last=ts;
  while(acc>=16.667){update();acc-=16.667}
  draw();requestAnimationFrame(loop);
}
fit();requestAnimationFrame(loop);
</script>
</body>
